<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NiceShot · Padel Manager</title>
<style>
  :root {
    --bg: #0b1220;
    --surface: #111b2e;
    --surface-2: #17243d;
    --line: #22324f;
    --text: #e8eef9;
    --muted: #8a9bbb;
    --accent: #3b82f6;
    --radius: 20px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }

  .pagina { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 28px; padding: calc(env(safe-area-inset-top, 0px) + 32px) 20px
      calc(env(safe-area-inset-bottom, 0px) + 32px); }

  /* Logo NiceShot (horizontal). Arquivo em icons/logo-niceshot-horizontal.png. */
  .logo { width: min(78vw, 300px); height: auto; display: block; }
  .logo-texto { display: none; font-size: 26px; font-weight: 800; letter-spacing: .02em; }
  .logo-falha .logo { display: none; }
  .logo-falha .logo-texto { display: block; }

  .quadrados { display: flex; flex-direction: column; gap: 16px; width: 100%; align-items: center; }

  .quadrado { width: min(54vw, 200px); aspect-ratio: 1 / 1; border-radius: 22px; text-decoration: none;
    color: var(--text); background: var(--surface); border: 1px solid var(--line); padding: 28px 24px;
    display: flex; flex-direction: column; justify-content: space-between; align-items: flex-start;
    box-shadow: 0 18px 40px rgba(0,0,0,.35); position: relative; overflow: hidden;
    transition: transform .15s, border-color .15s; }
  .quadrado:hover, .quadrado:focus-visible { transform: translateY(-2px); border-color: var(--accent); outline: none; }
  .quadrado::before { content: ""; position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(circle at 85% 10%, rgba(59,130,246,.22), transparent 55%); }
  .quadrado > * { position: relative; }

  .rotulo { font-size: 11px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: #93c5fd; }
  .titulo { font-size: 30px; font-weight: 800; letter-spacing: -.01em; line-height: 1.1; margin: 0; }
  .descricao { font-size: 15px; color: var(--muted); line-height: 1.45; margin: 10px 0 0; }

  .acao { align-self: stretch; text-align: center; background: var(--accent); color: #fff; font-weight: 800;
    font-size: 14px; letter-spacing: .08em; text-transform: uppercase; padding: 14px 16px; border-radius: 14px; }
  /* Quadrado do PSC PRO: somente o logo quadrado da abertura */
  .quadrado.psc, .quadrado.tm { padding: 0; background: transparent; border: 0; justify-content: center; align-items: center;
    box-shadow: 0 10px 24px rgba(0,0,0,.35); }
  .icone-quadrado { width: 100%; height: 100%; object-fit: cover; display: block; border-radius: 22px; }
  .quadrado.psc::before { display: none; }
  .logo-quadrado { width: 100%; height: 100%; object-fit: cover; display: block; }
  .logo-quadrado-texto { font-size: 30px; font-weight: 800; line-height: 1.15; text-align: center; padding: 24px; }
</style>
</head>
<body>
<main class="pagina" id="pagina">

  <header>
    <img class="logo" src="icons/logo-niceshot-horizontal.png" alt="NiceShot"
         onerror="document.getElementById('pagina').classList.add('logo-falha')">
    <div class="logo-texto">NiceShot</div>
  </header>

  <nav class="quadrados" aria-label="Aplicações">
    <a class="quadrado psc" href="index.html" aria-label="Padel Score and Coaching">
      <img class="logo-quadrado" src="icons/icon-384x384.png" alt="Padel Score and Coaching"
           onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'logo-quadrado-texto',textContent:'Padel Score and Coaching'}));">
    </a>

    <a class="quadrado tm" href="circuitopadel.html" aria-label="My Tournaments Manager">
      <img class="icone-quadrado" src="icons/MyTournamentsManager.jpeg" alt="My Tournaments Manager">
    </a>
  </nav>

</main>
</body>
</html>
