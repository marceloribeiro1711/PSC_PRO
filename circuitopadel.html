<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Padel Tournaments · Registration and Payments</title>
<style>
  :root {
    --bg: #0b1220;
    --surface: #111b2e;
    --surface-2: #17243d;
    --line: #22324f;
    --text: #e8eef9;
    --muted: #8a9bbb;
    --accent: #3b82f6;
    --open: #22c55e;
    --open-bg: rgba(34,197,94,.14);
    --pay: #f59e0b;
    --pay-bg: rgba(245,158,11,.14);
    --closed: #64748b;
    --live: #a855f7;
    --radius: 16px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  [hidden] { display: none !important; }

  /* ---------- Splash de países ---------- */
  #splash { min-height: 100vh; padding: 28px 16px 32px; max-width: 760px; margin: 0 auto; }
  #splash h1 { font-size: 30px; margin: 0 0 6px; letter-spacing: -.01em; text-align: center; }
  #splash .lead { color: var(--muted); text-align: center; margin: 0 0 8px; font-size: 15px; }
  .regiao { margin-top: 16px; }
  .regiao h2 { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: #9fb3d1;
    font-weight: 600; margin: 0 0 8px 2px; }
  .painel-bandeiras { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 6px;
    padding: 8px 10px; background: #0f1d36; border: 1px solid #1f3a66; border-radius: 12px; }
  .pais { background: transparent; border: 2px solid transparent; border-radius: 10px; padding: 4px 6px 3px;
    display: flex; flex-direction: column; align-items: center; gap: 2px; color: var(--text); cursor: pointer;
    min-width: 56px; font: inherit; transition: box-shadow .15s, border-color .15s; }
  .pais .emoji { font-size: 26px; line-height: 1; }
  .vazio-regiao { color: var(--muted); font-size: 12px; font-style: italic; padding: 8px 6px; }
  .pais .nome { font-size: 10px; color: #c9d6ea; text-align: center; }
  .pais[aria-pressed="true"] { border-color: #38bdf8; box-shadow: 0 0 16px rgba(56,189,248,.55); }
  .pais.breve { opacity: .4; cursor: not-allowed; }
  .pais .selo-breve { font-size: 9px; color: var(--muted); text-transform: uppercase; letter-spacing: .1em; }

  .botao-ver { display: block; margin: 34px auto 0; background: var(--accent); color: #fff; border: 0;
    border-radius: 14px; padding: 16px 44px; font-size: 15px; font-weight: 800; letter-spacing: .12em;
    text-transform: uppercase; cursor: pointer; box-shadow: 0 14px 34px rgba(59,130,246,.45); }
  .botao-ver:hover { filter: brightness(1.1); }
  .botao-ver:disabled { background: #2a3a58; color: #7f8fb0; box-shadow: none; cursor: not-allowed; }

  /* ---------- Lista de torneios ---------- */
  .barra { position: sticky; top: 0; z-index: 10; background: rgba(11,18,32,.92);
    backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
  .barra-interna { max-width: 1280px; margin: 0 auto; padding: 8px 24px; display: flex;
    align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .barra h1 { font-size: 15px; margin: 0; font-weight: 700; letter-spacing: -.01em; }
  .totais { display: flex; gap: 18px; align-items: center; font-size: 13px; font-weight: 600; }
  .total { display: flex; align-items: center; gap: 7px; }
  .total .ponto { width: 8px; height: 8px; border-radius: 50%; }
  .total.open { color: var(--open); } .total.open .ponto { background: var(--open); }
  .total.pay { color: var(--pay); } .total.pay .ponto { background: var(--pay); }
  .total b { font-size: 16px; font-variant-numeric: tabular-nums; }
  .trocar { background: var(--surface); color: var(--text); border: 1px solid var(--line); border-radius: 999px;
    padding: 6px 12px; font-size: 12px; cursor: pointer; }

  .meta { max-width: 1280px; margin: 10px auto 0; padding: 0 24px; color: var(--muted); font-size: 12px; }

  .filtros { max-width: 1280px; margin: 14px auto 4px; padding: 0 24px; display: flex; flex-direction: column; gap: 8px; }
  .linha { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { background: var(--surface); color: var(--text); border: 1px solid var(--line);
    border-radius: 999px; padding: 6px 12px; font-size: 13px; cursor: pointer; }
  .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }

  main { max-width: 1280px; margin: 16px auto 40px; padding: 0 24px;
    display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 18px; }

  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
    overflow: hidden; display: flex; flex-direction: column; }
  .card.destaque-pay { border-color: rgba(245,158,11,.55); box-shadow: 0 0 0 1px rgba(245,158,11,.25) inset; }
  .card.destaque-open { border-color: rgba(34,197,94,.55); box-shadow: 0 0 0 1px rgba(34,197,94,.25) inset; }

  .topo { padding: 16px 18px 12px; display: flex; flex-direction: column; gap: 6px; }
  .linha-circuito { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .circuito { font-size: 20px; font-weight: 800; color: #ffffff; letter-spacing: .02em;
    text-transform: uppercase; line-height: 1.1; }
  .linha-nome { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  h2 { font-size: 17px; margin: 4px 0 0; line-height: 1.3; }
  .bandeira-card { font-size: 22px; line-height: 1; flex: 0 0 auto; }
  .clube { color: #cbd5e1; font-size: 14px; font-weight: 600; }
  .local { color: var(--muted); font-size: 13px; }

  .alerta { margin: 0 18px; padding: 10px 12px; border-radius: 12px; font-weight: 700;
    font-size: 13px; display: flex; align-items: center; gap: 10px; }
  .alerta .ponto { width: 9px; height: 9px; border-radius: 50%; flex: 0 0 9px; }
  .alerta.open { background: var(--open-bg); color: var(--open); }
  .alerta.open .ponto { background: var(--open); animation: pisca 1.4s infinite; }
  .alerta.pay { background: var(--pay-bg); color: var(--pay); }
  .alerta.live { background: rgba(168,85,247,.16); color: #d8b4fe; }
  .alerta.live .ponto { background: var(--live); animation: pisca 1.4s infinite; }
  .alerta.closed { background: var(--surface-2); color: var(--muted); }
  .alerta.closed .ponto { background: var(--closed); }
  @keyframes pisca { 0%,100% { opacity: 1; } 50% { opacity: .25; } }

  .sirene { width: 30px; height: 30px; flex: 0 0 30px; border-radius: 50%; position: relative;
    overflow: hidden; background: radial-gradient(circle at 50% 35%, #fecaca 0, #ef4444 45%, #7f1d1d 100%);
    box-shadow: 0 0 10px rgba(239,68,68,.6); }
  .sirene::after { content: ""; position: absolute; inset: -40%; border-radius: 50%;
    background: conic-gradient(from 0deg, transparent 0deg 60deg, rgba(255,255,255,.9) 70deg,
      transparent 90deg 180deg, rgba(255,255,255,.9) 190deg, transparent 210deg 360deg);
    animation: gira 1s linear infinite; }
  @keyframes gira { to { transform: rotate(360deg); } }

  .contagem { margin: 12px 18px 0; background: var(--surface-2); border-radius: 12px; padding: 12px 14px; }
  .contagem small { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; }
  .relogio { display: flex; gap: 8px; margin-top: 6px; font-variant-numeric: tabular-nums; }
  .bloco-t { text-align: center; min-width: 52px; }
  .bloco-t b { display: block; font-size: 22px; line-height: 1.1; }
  .bloco-t span { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
  .encerrado { font-size: 15px; font-weight: 600; color: var(--muted); }

  dl { margin: 12px 18px 0; display: grid; grid-template-columns: 1fr 1fr; gap: 10px 14px; }
  dl div { min-width: 0; }
  dt { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
  dd { margin: 2px 0 0; font-size: 14px; word-break: break-word; }
  dd.vazio { color: #4b5b78; font-style: italic; }
  .largo { grid-column: 1 / -1; }

  .rodape { margin-top: auto; padding: 14px 18px 16px; display: flex; justify-content: flex-end;
    border-top: 1px solid var(--line); margin-top: 16px; }
  .botao { background: var(--accent); color: #fff; text-decoration: none; font-weight: 600;
    font-size: 13px; padding: 9px 14px; border-radius: 10px; }
  .botao:hover { filter: brightness(1.1); }

  .alerta.pago { background: rgba(34,197,94,.10); color: #86efac; border: 1px solid rgba(34,197,94,.35); }
  .alerta.pago .marca-ok { width: 20px; height: 20px; border-radius: 50%; background: var(--open); color: #04210f;
    font-size: 12px; line-height: 20px; text-align: center; flex: 0 0 20px; font-weight: 800; }
  .acoes { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
  .botao-pagar { background: #dc2626; color: #ffffff; border: 0; border-radius: 10px; padding: 9px 14px;
    font-size: 13px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; cursor: pointer; }
  .botao-pagar.pago { background: #16a34a; color: #ffffff; }
  .botao-pagar:hover { filter: brightness(1.08); }

  .vazio-lista { grid-column: 1 / -1; text-align: center; color: var(--muted); padding: 40px 0; }
  footer { max-width: 1280px; margin: 0 auto 30px; padding: 0 24px; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>

<!-- ======================= SPLASH: escolha de países ======================= -->
<section id="splash" aria-label="Choose countries">
  <h1>Padel Tournaments</h1>
  <p class="lead">Choose one or more countries</p>
  <div id="grade-paises"></div>
  <button class="botao-ver" id="btn-ver" type="button" hidden>See tournaments</button>
</section>

<!-- ======================= LISTA DE TORNEIOS ======================= -->
<div id="lista-view" hidden>

        <span class="total pay"><span class="ponto"></span>Payment open <b id="k-pagamento">0</b></span>
      </div>
      <button class="trocar" id="btn-trocar" type="button">Countries</button>
    </div>
  </div>
  <div class="meta" id="atualizado">Loading…</div>

  <section class="filtros" aria-label="Filters">
    <div class="linha" id="f-circuito">
      <button class="chip" data-valor="todos" aria-pressed="true">All</button>
      <button class="chip" data-valor="FIP Promises" aria-pressed="false">FIP Promises</button>
      <button class="chip" data-valor="CUPRA FIP Tour" aria-pressed="false">CUPRA FIP Tour</button>
      <button class="chip" data-valor="FPP Portugal" aria-pressed="false">FPP</button>
    </div>
    <div class="linha" id="f-categoria">
      <button class="chip" data-valor="todas" aria-pressed="true">All</button>
      <button class="chip" data-valor="ABS" aria-pressed="false">ABS</button>
      <button class="chip" data-valor="VET" aria-pressed="false">VET</button>
      <button class="chip" data-valor="JOV" aria-pressed="false">JOV</button>
    </div>
    <div class="linha" id="f-status">
      <button class="chip" data-valor="todos" aria-pressed="true">All</button>
      <button class="chip" data-valor="abertas" aria-pressed="false">Registration open</button>
      <button class="chip" data-valor="pagamento" aria-pressed="false">Payment open</button>
    </div>
  </section>

  <main id="lista" aria-live="polite"></main>

  <footer>
    Complementary information. Athletes are always responsible for confirming deadlines and rules with the organizer.
    Times are shown in your local time.
  </footer>
</div>

const ESTADO = { circuito: "todos", categoria: "todas", status: "todos" };

let TORNEIOS = [];

const MESES_EN = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

// ---------- países ----------
// Normaliza nomes: sem acento, minúsculo, sem espaços extras
function normalizaNome(s) {
  return String(s || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().trim();
}

// Índice de busca: nome em inglês, português e aliases
const INDICE_PAISES = new Map();
PAISES.forEach(p => {
  [p.nome, p.nomePt, ...p.aliases].forEach(n => INDICE_PAISES.set(normalizaNome(n), p));
});

function paisPorNome(nome) {
  return INDICE_PAISES.get(normalizaNome(nome)) || null;
}

// Bandeira em emoji, gerada a partir do código do país (sem imagens externas)
function bandeiraEmoji(codigo) {
  if (!codigo) return "🌍";
  return String.fromCodePoint(...codigo.toUpperCase().split("").map(c => 127397 + c.charCodeAt(0)));
}

function carregarSelecao() {
  try {
    const v = JSON.parse(localStorage.getItem(CHAVE_PAISES) || "null");
    return Array.isArray(v) ? v : null;
  } catch (e) { return null; }
}

// Chave única de cada país: código (quando mapeado) ou nome
function chaveDoPais(p) { return p.codigo || p.nome; }

// Países que existem nos torneios carregados, agrupados por região
function paisesDisponiveis() {
  const mapa = new Map();
  TORNEIOS.forEach(t => {
    if (!t.pais) return;
    const cfg = paisPorNome(t.pais);
    const chave = cfg ? cfg.codigo : t.pais;
    if (!mapa.has(chave)) {
      mapa.set(chave, cfg ? { ...cfg } : { codigo: null, nome: t.pais, nomePt: t.pais, regiao: "Other" });
    }
  });
  return [...mapa.values()];
}

function salvarSelecao() {
  try { localStorage.setItem(CHAVE_PAISES, JSON.stringify(PAISES_SEL)); } catch (e) { /* sem armazenamento */ }
}

function montarSplash() {
  const grade = document.getElementById("grade-paises");
  const disponiveis = paisesDisponiveis();
  // Todas as regiões aparecem sempre; "Other" só quando houver país sem mapeamento
  const grupoDe = p => (p.regiao === "Other" ? "Africa & Oceania" : p.regiao);
  grade.innerHTML = ORDEM_REGIOES.map(reg => {
    const paises = disponiveis.filter(p => grupoDe(p) === reg);
    const corpo = paises.length
      ? paises.map(p => {
          const sel = PAISES_SEL.includes(chaveDoPais(p));
          return `<button class="pais" type="button" data-chave="${escapar(chaveDoPais(p))}" aria-pressed="${sel}">
            <span class="emoji">${bandeiraEmoji(p.codigo)}</span>
            <span class="nome">${escapar(p.nome)}</span>
          </button>`;
        }).join("")
      : `<span class="vazio-regiao">No tournaments yet</span>`;
    return `<section class="regiao"><h2>${reg}</h2><div class="painel-bandeiras">${corpo}</div></section>`;
  }).join("");
}

// ---------- datas ----------
function dataLocal(iso, hora) {
  if (!iso) return null;
  const [a, m, d] = iso.slice(0, 10).split("-").map(Number);
  if (hora) {
    const [hh, mm] = hora.split(":").map(Number);
    return { data: new Date(a, m - 1, d, hh, mm), exata: true };
  }
  return { data: new Date(a, m - 1, d, 23, 59, 59), exata: false };
}

function formataData(iso) {
  if (!iso) return null;
  const [a, m, d] = iso.slice(0, 10).split("-").map(Number);
  return `${d} ${MESES_EN[m - 1]} ${a}`;
}

function formataFaixa(i, f) {
  if (!i && !f) return null;
  if (i && f && i !== f) return `${formataData(i)} – ${formataData(f)}`;
  return formataData(i || f);
}

function formataDataHora(iso) {
  if (!iso) return null;
  const [dia, hora] = iso.split("T");
  const [a, m, d] = dia.split("-");
  return `${d}-${m}-${a}${hora ? " " + hora.slice(0, 5) : ""}`;
}

// ---------- "Já paguei": controle local deste navegador (não vai para a planilha) ----------
const CHAVE_PAGOS = "circuitopadel.pagos";
let PAGOS = [];

function carregarPagos() {
  try {
    const v = JSON.parse(localStorage.getItem(CHAVE_PAGOS) || "[]");
    return Array.isArray(v) ? v : [];
  } catch (e) { return []; }
}

function salvarPagos() {
  try { localStorage.setItem(CHAVE_PAGOS, JSON.stringify(PAGOS)); } catch (e) { /* sem armazenamento */ }
}

// Identificador estável do torneio: link oficial, ou nome + início como reserva
function idTorneio(t) {
  return t.link || `${t.torneio}|${t.inicio || ""}`;
}

function alternarPago(id) {
  PAGOS = PAGOS.includes(id) ? PAGOS.filter(x => x !== id) : [...PAGOS, id];
  salvarPagos();
}

function escapar(t) {
  return String(t ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

// ---------- circuito e categoria ----------
function circuitoDe(t) {
  const base = (t.circuito || "") + " " + (t.torneio || "");
  if (!/FIP/i.test(base)) return t.circuito || "FPP";
  if (/PROMISES/i.test(base)) return "FIP Promises";
  if (/CUPRA|BRONZE|SILVER|GOLD|PLATINUM|STAR|RISE|PROMOTION/i.test(base)) return "CUPRA FIP Tour";
  return "FIP (other)";
}

function categoriaDe(t) {
  const c = circuitoDe(t);
  if (c === "FIP Promises") return "JOV";
  if (c === "CUPRA FIP Tour") return "ABS";
  const cat = (t.categoria || "").toUpperCase();
  if (!cat) return null;
  return cat === "JUV" ? "JOV" : cat;
}

// ---------- status pelo relógio ----------
function calcularStatus(t, agora) {
  const insc = dataLocal(t.inscData, t.inscHora);
  const pag  = dataLocal(t.pagData, t.pagHora);
  const inscPassou = insc ? (insc.exata ? agora >= insc.data : agora > insc.data) : null;
  const pagPassou  = pag  ? (pag.exata  ? agora >= pag.data  : agora > pag.data)  : null;
  const coleta = (t.statusColeta || "").toLowerCase();

  if (inscPassou === false) return { chave: "abertas", rotulo: "Registration open", alvo: insc };
  if (inscPassou === true && pagPassou === false)
    return { chave: "pagamento", rotulo: "Payment open", alvo: pag };

  if (inscPassou === null && pagPassou === null) {
    if (coleta.includes("abert")) return { chave: "abertas", rotulo: "Registration open", alvo: null };
    if (coleta.includes("pagamentos")) return { chave: "pagamento", rotulo: "Payment open", alvo: null };
    if (coleta.includes("decorrer")) return { chave: "curso", rotulo: "In progress", alvo: null };
  }
  if (inscPassou === true && pagPassou === null && coleta.includes("decorrer"))
    return { chave: "curso", rotulo: "In progress", alvo: null };

  return { chave: "fechadas", rotulo: "Registration closed", alvo: null };
}

// ---------- cartão ----------
function blocoAlerta(st) {
  if (st.chave === "pagamento")
    return `<div class="alerta pay"><span class="sirene" aria-hidden="true"></span>${st.rotulo}</div>`;
  const mapa = {
    abertas:  ["open",   "Registration open"],
    curso:    ["live",   "In progress"],
    fechadas: ["closed", "Registration closed"],
  };
  const [classe, texto] = mapa[st.chave];
  return `<div class="alerta ${classe}"><span class="ponto"></span>${texto}</div>`;
}

function blocoContagem(st) {
  if (!st.alvo) return "";
  const rotulo = st.chave === "abertas" ? "Registration closes in" : "Payment closes in";
  return `<div class="contagem" data-alvo="${st.alvo.data.getTime()}" data-exata="${st.alvo.exata}">
    <small>${rotulo}</small>
    <div class="relogio"></div>
  </div>`;
}

function campo(rotulo, valor, largo = false) {
  const vazio = !valor;
  return `<div class="${largo ? "largo" : ""}"><dt>${rotulo}</dt>
    <dd class="${vazio ? "vazio" : ""}">${vazio ? "No information" : escapar(valor)}</dd></div>`;
}

function cartao(t, st) {
  const id = idTorneio(t);
  const emPagamento = st.chave === "pagamento";
  const pago = emPagamento && PAGOS.includes(id);
  const destaque = pago ? "" : st.chave === "abertas" ? "destaque-open" : st.chave === "pagamento" ? "destaque-pay" : "";
  const alerta = pago
    ? `<div class="alerta pago"><span class="marca-ok">✓</span>Already paid</div>`
    : blocoAlerta(st);
  const contagem = blocoContagem(st);
  const botaoPagar = emPagamento
    ? `<button class="botao-pagar ${pago ? "pago" : ""}" type="button" data-id="${escapar(id)}" aria-pressed="${pago}">${pago ? "PAID" : "NOT PAID"}</button>`
    : "";
  const inscricao = t.inscData
    ? `${formataData(t.inscData)}${t.inscHora ? " · " + t.inscHora : ""}` : null;
  const pagamento = t.pagData
    ? `${formataData(t.pagData)}${t.pagHora ? " · " + t.pagHora : ""}` : null;
  const pais = paisPorNome(t.pais);
  const bandeira = pais ? `<span class="bandeira-card" title="${escapar(pais.nome)}">${bandeiraEmoji(pais.codigo)}</span>` : "";
  const cat = categoriaDe(t);

  return `<article class="card ${destaque}">
    <div class="topo">
      <div class="linha-circuito">
        <span class="circuito">${escapar(circuitoDe(t))}</span>
        ${cat ? `<span class="circuito">${escapar(cat)}</span>` : ""}
      </div>
      <div class="linha-nome">
        <h2>${escapar(t.torneio)}</h2>
        ${bandeira}
      </div>
      ${t.clube ? `<div class="clube">${escapar(t.clube)}</div>` : ""}
      <div class="local">${escapar([t.cidade, t.pais].filter(Boolean).join(" · "))}</div>
    </div>

    ${alerta}
    ${contagem}

    <dl>
      ${campo("Dates", formataFaixa(t.inicio, t.fim), true)}
      ${campo("Registration until", inscricao)}
      ${campo("Payment until", pagamento)}
      ${campo("Gender", t.genero)}
    </dl>

    <div class="rodape">
      <div class="acoes">
        ${botaoPagar}
        ${t.link ? `<a class="botao" href="${escapar(t.link)}" target="_blank" rel="noopener">View tournament</a>` : ""}
      </div>
    </div>
  </article>`;
}

// ---------- contagem regressiva ----------
function formataRestante(ms) {
  const total = Math.max(0, Math.floor(ms / 1000));
  const d = Math.floor(total / 86400);
  const h = Math.floor((total % 86400) / 3600);
  const m = Math.floor((total % 3600) / 60);
  const s = total % 60;
  const bloco = (v, r) => `<div class="bloco-t"><b>${String(v).padStart(2, "0")}</b><span>${r}</span></div>`;
  return bloco(d, "days") + bloco(h, "hours") + bloco(m, "min") + bloco(s, "sec");
}

function atualizarRelogios() {
  const agora = Date.now();
  document.querySelectorAll(".contagem").forEach(el => {
    const alvo = Number(el.dataset.alvo);
    const cont = el.querySelector(".relogio");
    cont.innerHTML = alvo - agora > 0
      ? formataRestante(alvo - agora)
      : `<span class="encerrado">Deadline passed</span>`;
  });
}

// ---------- filtros e renderização ----------
function passaFiltro(t, st) {
  if (PAISES_SEL.length) {
    const cfg = paisPorNome(t.pais);
    const chave = cfg ? cfg.codigo : t.pais;
    if (!PAISES_SEL.includes(chave)) return false;
  }
  if (ESTADO.circuito !== "todos" && circuitoDe(t) !== ESTADO.circuito) return false;
  if (ESTADO.categoria !== "todas" && categoriaDe(t) !== ESTADO.categoria) return false;
  if (ESTADO.status === "abertas" && st.chave !== "abertas") return false;
  if (ESTADO.status === "pagamento" && st.chave !== "pagamento") return false;
  return true;
}

function ordenar(a, b) {
  const peso = { pagamento: 0, abertas: 1, curso: 2, fechadas: 3 };
  if (peso[a.st.chave] !== peso[b.st.chave]) return peso[a.st.chave] - peso[b.st.chave];
  const ta = a.st.alvo ? a.st.alvo.data.getTime() : Infinity;
  const tb = b.st.alvo ? b.st.alvo.data.getTime() : Infinity;
  return ta - tb;
}

function renderizar() {
  const agora = new Date();
  const itens = TORNEIOS.map(t => ({ t, st: calcularStatus(t, agora) }));

  document.getElementById("k-abertas").textContent = itens.filter(i => i.st.chave === "abertas").length;
  document.getElementById("k-pagamento").textContent = itens.filter(i => i.st.chave === "pagamento").length;

  const visiveis = itens.filter(i => passaFiltro(i.t, i.st)).sort(ordenar);
  document.getElementById("lista").innerHTML = visiveis.length
    ? visiveis.map(i => cartao(i.t, i.st)).join("")
    : `<div class="vazio-lista">No tournaments match these filters.</div>`;

  atualizarRelogios();
}

function ligarFiltros() {
  document.querySelectorAll(".filtros .linha").forEach(linha => {
    const chave = linha.id.replace("f-", "");
    linha.querySelectorAll(".chip").forEach(botao => {
      botao.addEventListener("click", () => {
        linha.querySelectorAll(".chip").forEach(b => b.setAttribute("aria-pressed", "false"));
        botao.setAttribute("aria-pressed", "true");
        ESTADO[chave] = botao.dataset.valor;
        renderizar();
      });
    });
  });
}

async function carregar() {
  let dados = null;
  let erro = "";
  try {
    const resp = await fetch(ARQUIVO_JSON, { cache: "no-store" });
    if (resp.ok) dados = await resp.json();
    else erro = `response ${resp.status}`;
  } catch (e) {
    erro = "the browser blocked the file (open the page from GitHub Pages or a local server, not from the file itself)";
  }
  if (!dados) {
    document.getElementById("atualizado").textContent = `Data not loaded (${ARQUIVO_JSON}): ${erro}`;
    return;
  }
  TORNEIOS = dados;

  // Seleção salva vale; se não houver (ou não existir mais), marca todos os países disponíveis
  const disponiveis = paisesDisponiveis().map(chaveDoPais);
  PAISES_SEL = (SELECAO_SALVA || []).filter(c => disponiveis.includes(c));
  montarSplash();
  atualizarSplash();

  const ultima = dados.map(t => t.coletadoEm).filter(Boolean).sort().pop();
  document.getElementById("atualizado").textContent =
    ultima ? `Last update: ${formataDataHora(ultima)}` : "Last update: not available";
}

SELECAO_SALVA = carregarSelecao();
PAGOS = carregarPagos();
document.getElementById("lista").addEventListener("click", (e) => {
  const b = e.target.closest(".botao-pagar");
  if (!b) return;
  alternarPago(b.dataset.id);
  renderizar();
});
document.getElementById("grade-paises").innerHTML = `<p class="lead">Loading…</p>`;
ligarSplash();
ligarFiltros();
carregar();

setInterval(() => {
  if (document.getElementById("lista-view").hidden) return;
  const agora = new Date();
  const mudou = TORNEIOS.some(t => {
    const st = calcularStatus(t, agora);
    return st.alvo && st.alvo.data < agora;
  });
  if (mudou) renderizar(); else atualizarRelogios();
}, 1000);
</script>
