<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Torneios de Padel · Inscrições e Pagamentos</title>
<style>
  :root {
    --bg: #0b1220;
    --surface: #111b2e;
    --surface-2: #17243d;
    --line: #22324f;
    --text: #e8eef9;
    --muted: #8a9bbb;
    --accent: #3b82f6;
    --open: #22c55e;
    --open-bg: rgba(34,197,94,.14);
    --pay: #f59e0b;
    --pay-bg: rgba(245,158,11,.14);
    --closed: #64748b;
    --live: #a855f7;
    --radius: 16px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }

  /* Barra fina de totais */
  .barra { position: sticky; top: 0; z-index: 10; background: rgba(11,18,32,.92);
    backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
  .barra-interna { max-width: 1280px; margin: 0 auto; padding: 8px 24px; display: flex;
    align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .barra h1 { font-size: 15px; margin: 0; font-weight: 700; letter-spacing: -.01em; }
  .totais { display: flex; gap: 18px; align-items: center; font-size: 13px; font-weight: 600; }
  .total { display: flex; align-items: center; gap: 7px; }
  .total .ponto { width: 8px; height: 8px; border-radius: 50%; }
  .total.open { color: var(--open); } .total.open .ponto { background: var(--open); }
  .total.pay { color: var(--pay); } .total.pay .ponto { background: var(--pay); }
  .total b { font-size: 16px; font-variant-numeric: tabular-nums; }

  .meta { max-width: 1280px; margin: 10px auto 0; padding: 0 24px; color: var(--muted); font-size: 12px; }

  .filtros { max-width: 1280px; margin: 14px auto 4px; padding: 0 24px; display: flex;
    flex-wrap: wrap; gap: 12px 24px; align-items: center; }
  .grupo { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .grupo label { color: var(--muted); font-size: 12px; text-transform: uppercase;
    letter-spacing: .06em; margin-right: 4px; }
  .chip { background: var(--surface); color: var(--text); border: 1px solid var(--line);
    border-radius: 999px; padding: 6px 12px; font-size: 13px; cursor: pointer; }
  .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }

  main { max-width: 1280px; margin: 16px auto 40px; padding: 0 24px;
    display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 18px; }

  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
    overflow: hidden; display: flex; flex-direction: column; }
  .card.destaque-pay { border-color: rgba(245,158,11,.55); box-shadow: 0 0 0 1px rgba(245,158,11,.25) inset; }
  .card.destaque-open { border-color: rgba(34,197,94,.55); box-shadow: 0 0 0 1px rgba(34,197,94,.25) inset; }

  .topo { padding: 16px 18px 12px; display: flex; flex-direction: column; gap: 6px; }
  .circuito { font-size: 20px; font-weight: 800; color: #ffffff; letter-spacing: .02em;
    text-transform: uppercase; line-height: 1.1; }
  .linha-circuito { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .etiquetas { display: flex; gap: 6px; flex-wrap: wrap; }
  .tag { font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase;
    padding: 4px 8px; border-radius: 6px; background: var(--surface-2); color: var(--muted); }
  .tag.cat { background: rgba(59,130,246,.18); color: #93c5fd; }
  h2 { font-size: 17px; margin: 4px 0 0; line-height: 1.3; }
  .clube { color: #cbd5e1; font-size: 14px; font-weight: 600; }
  .local { color: var(--muted); font-size: 13px; }

  .alerta { margin: 0 18px; padding: 10px 12px; border-radius: 12px; font-weight: 700;
    font-size: 13px; display: flex; align-items: center; gap: 10px; }
  .alerta .ponto { width: 9px; height: 9px; border-radius: 50%; flex: 0 0 9px; }
  .alerta.open { background: var(--open-bg); color: var(--open); }
  .alerta.open .ponto { background: var(--open); animation: pisca 1.4s infinite; }
  .alerta.pay { background: var(--pay-bg); color: var(--pay); }
  .alerta.live { background: rgba(168,85,247,.16); color: #d8b4fe; }
  .alerta.live .ponto { background: var(--live); animation: pisca 1.4s infinite; }
  .alerta.closed { background: var(--surface-2); color: var(--muted); }
  .alerta.closed .ponto { background: var(--closed); }
  @keyframes pisca { 0%,100% { opacity: 1; } 50% { opacity: .25; } }

  /* Sirene: disco vermelho com feixe giratório, sem áudio */
  .sirene { width: 30px; height: 30px; flex: 0 0 30px; border-radius: 50%; position: relative;
    overflow: hidden; background: radial-gradient(circle at 50% 35%, #fecaca 0, #ef4444 45%, #7f1d1d 100%);
    box-shadow: 0 0 10px rgba(239,68,68,.6); }
  .sirene::after { content: ""; position: absolute; inset: -40%; border-radius: 50%;
    background: conic-gradient(from 0deg, transparent 0deg 60deg, rgba(255,255,255,.9) 70deg,
      transparent 90deg 180deg, rgba(255,255,255,.9) 190deg, transparent 210deg 360deg);
    animation: gira 1s linear infinite; }
  @keyframes gira { to { transform: rotate(360deg); } }
  .alerta.pay .sirene { margin-left: -2px; }

  .contagem { margin: 12px 18px 0; background: var(--surface-2); border-radius: 12px; padding: 12px 14px; }
  .contagem small { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; }
  .relogio { display: flex; gap: 8px; margin-top: 6px; font-variant-numeric: tabular-nums; }
  .bloco-t { text-align: center; min-width: 52px; }
  .bloco-t b { display: block; font-size: 22px; line-height: 1.1; }
  .bloco-t span { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
  .encerrado { font-size: 15px; font-weight: 600; color: var(--muted); }

  dl { margin: 12px 18px 0; display: grid; grid-template-columns: 1fr 1fr; gap: 10px 14px; }
  dl div { min-width: 0; }
  dt { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
  dd { margin: 2px 0 0; font-size: 14px; word-break: break-word; }
  dd.vazio { color: #4b5b78; font-style: italic; }
  .largo { grid-column: 1 / -1; }

  .rodape { margin-top: auto; padding: 14px 18px 16px; display: flex; justify-content: flex-end;
    align-items: center; gap: 10px; border-top: 1px solid var(--line); margin-top: 16px; }
  .fonte { font-size: 11px; color: var(--muted); }
  .botao { background: var(--accent); color: #fff; text-decoration: none; font-weight: 600;
    font-size: 13px; padding: 9px 14px; border-radius: 10px; }
  .botao:hover { filter: brightness(1.1); }

  .vazio-lista { grid-column: 1 / -1; text-align: center; color: var(--muted); padding: 40px 0; }
  footer { max-width: 1280px; margin: 0 auto 30px; padding: 0 24px; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>

<div class="barra">
  <div class="barra-interna">
    <h1>Torneios de Padel</h1>
    <div class="totais" aria-label="Totais">
      <span class="total open"><span class="ponto"></span>Inscrições abertas <b id="k-abertas">0</b></span>
      <span class="total pay"><span class="ponto"></span>Pagamentos a decorrer <b id="k-pagamento">0</b></span>
    </div>
  </div>
</div>
<div class="meta" id="atualizado">Carregando…</div>

<section class="filtros" aria-label="Filtros">
  <div class="grupo" id="f-circuito">
    <label>Circuito</label>
    <button class="chip" data-valor="todos" aria-pressed="true">Todos</button>
    <button class="chip" data-valor="FPP Portugal" aria-pressed="false">FPP Portugal</button>
    <button class="chip" data-valor="FIP Promises" aria-pressed="false">FIP Promises</button>
    <button class="chip" data-valor="CUPRA FIP Tour" aria-pressed="false">CUPRA FIP Tour</button>
  </div>
  <div class="grupo" id="f-categoria">
    <label>Categoria</label>
    <button class="chip" data-valor="todas" aria-pressed="true">Todas</button>
    <button class="chip" data-valor="ABS" aria-pressed="false">ABS</button>
    <button class="chip" data-valor="VET" aria-pressed="false">VET</button>
    <button class="chip" data-valor="JOV" aria-pressed="false">JOV</button>
  </div>
  <div class="grupo" id="f-status">
    <label>Mostrar</label>
    <button class="chip" data-valor="todos" aria-pressed="true">Todos</button>
    <button class="chip" data-valor="abertas" aria-pressed="false">Inscrições abertas</button>
    <button class="chip" data-valor="pagamento" aria-pressed="false">Pagamento a decorrer</button>
  </div>
</section>

<main id="lista" aria-live="polite"></main>

<footer>
  Informação complementar. A obrigação de confirmar prazos e regulamentos é sempre do atleta.
  Os estados e contagens são calculados no seu dispositivo, com a hora local.
</footer>

<script>
// ==========================================================
// DADOS: arquivo JSON fixo, sem versão, publicado junto com a página no GitHub.
// Gerado pelo robô (torneiosjson.json). Sem o arquivo, a página avisa no topo.
// ==========================================================
const ARQUIVO_JSON = "torneiosjson.json";
const DADOS_EMBUTIDOS = null; // sem cópia embutida: os dados vêm sempre do JSON

const ESTADO = { circuito: "todos", categoria: "todas", status: "todos" };
let TORNEIOS = [];

const MESES_PT = ["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];

function dataLocal(iso, hora) {
  if (!iso) return null;
  const [a, m, d] = iso.slice(0, 10).split("-").map(Number);
  if (hora) {
    const [hh, mm] = hora.split(":").map(Number);
    return { data: new Date(a, m - 1, d, hh, mm), exata: true };
  }
  return { data: new Date(a, m - 1, d, 23, 59, 59), exata: false };
}

function formataData(iso) {
  if (!iso) return null;
  const [a, m, d] = iso.slice(0, 10).split("-").map(Number);
  return `${String(d).padStart(2, "0")} ${MESES_PT[m - 1]} ${a}`;
}

function formataFaixa(i, f) {
  if (!i && !f) return null;
  if (i && f && i !== f) return `${formataData(i)} – ${formataData(f)}`;
  return formataData(i || f);
}

// Circuito de exibição: separa FIP Promises e CUPRA FIP Tour pelo nome do torneio/circuito
function circuitoDe(t) {
  const base = (t.circuito || "") + " " + (t.torneio || "");
  if (!/FIP/i.test(base)) return t.circuito || "FPP Portugal";
  if (/PROMISES/i.test(base)) return "FIP Promises";
  if (/CUPRA|BRONZE|SILVER|GOLD|PLATINUM|STAR|RISE|PROMOTION/i.test(base)) return "CUPRA FIP Tour";
  return "FIP (outros)";
}

// Categoria padrão por circuito FIP; JUV passa a ser JOV
function categoriaDe(t) {
  const c = circuitoDe(t);
  if (c === "FIP Promises") return "JOV";
  if (c === "CUPRA FIP Tour") return "ABS";
  const cat = (t.categoria || "").toUpperCase();
  if (!cat) return null;
  return cat === "JUV" ? "JOV" : cat;
}

// Data e hora no formato dd-mm-aaaa hh:mm
function formataDataHora(iso) {
  if (!iso) return null;
  const [dia, hora] = iso.split("T");
  const [a, m, d] = dia.split("-");
  return `${d}-${m}-${a}${hora ? " " + hora.slice(0, 5) : ""}`;
}

function escapar(t) {
  return String(t ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

// Status calculado com o relógio a partir das datas.
// Quando não há data de inscrição, vale o status que o robô coletou.
function calcularStatus(t, agora) {
  const insc = dataLocal(t.inscData, t.inscHora);
  const pag  = dataLocal(t.pagData, t.pagHora);
  const inscPassou = insc ? (insc.exata ? agora >= insc.data : agora > insc.data) : null;
  const pagPassou  = pag  ? (pag.exata  ? agora >= pag.data  : agora > pag.data)  : null;
  const coleta = (t.statusColeta || "").toLowerCase();

  if (inscPassou === false) return { chave: "abertas", rotulo: "Inscrições abertas", alvo: insc };

  if (inscPassou === true && pagPassou === false)
    return { chave: "pagamento", rotulo: "Pagamento a decorrer", alvo: pag };

  if (inscPassou === null && pagPassou === null) {
    if (coleta.includes("abert")) return { chave: "abertas", rotulo: "Inscrições abertas", alvo: null };
    if (coleta.includes("pagamentos")) return { chave: "pagamento", rotulo: "Pagamento a decorrer", alvo: null };
    if (coleta.includes("decorrer")) return { chave: "curso", rotulo: "Torneio a decorrer", alvo: null };
  }

  if (inscPassou === true && pagPassou === null && coleta.includes("decorrer"))
    return { chave: "curso", rotulo: "Torneio a decorrer", alvo: null };

  return { chave: "fechadas", rotulo: "Inscrições encerradas", alvo: null };
}

function blocoAlerta(st) {
  if (st.chave === "pagamento")
    return `<div class="alerta pay"><span class="sirene" aria-hidden="true"></span>${st.rotulo}</div>`;
  const mapa = {
    abertas:  ["open",   "Inscrições abertas"],
    curso:    ["live",   "Torneio a decorrer"],
    fechadas: ["closed", "Inscrições encerradas"],
  };
  const [classe, texto] = mapa[st.chave];
  return `<div class="alerta ${classe}"><span class="ponto"></span>${texto}</div>`;
}

function blocoContagem(st) {
  if (!st.alvo) return "";
  const rotulo = st.chave === "abertas" ? "Fecha as inscrições em" : "Fecha o pagamento em";
  return `<div class="contagem" data-alvo="${st.alvo.data.getTime()}" data-exata="${st.alvo.exata}">
    <small>${rotulo}</small>
    <div class="relogio"></div>
  </div>`;
}

function campo(rotulo, valor, largo = false) {
  const vazio = !valor;
  return `<div class="${largo ? "largo" : ""}"><dt>${rotulo}</dt>
    <dd class="${vazio ? "vazio" : ""}">${vazio ? "Sem informação" : escapar(valor)}</dd></div>`;
}

function cartao(t, st) {
  const destaque = st.chave === "abertas" ? "destaque-open" : st.chave === "pagamento" ? "destaque-pay" : "";
  const inscricao = t.inscData
    ? `${formataData(t.inscData)}${t.inscHora ? " · " + t.inscHora : ""}` : null;
  const pagamento = t.pagData
    ? `${formataData(t.pagData)}${t.pagHora ? " · " + t.pagHora : ""}` : null;

  return `<article class="card ${destaque}">
    <div class="topo">
      <div class="linha-circuito">
        <span class="circuito">${escapar(circuitoDe(t))}</span>
        ${categoriaDe(t) ? `<span class="circuito">${escapar(categoriaDe(t))}</span>` : ""}
      </div>
      <h2>${escapar(t.torneio)}</h2>
      ${t.clube ? `<div class="clube">${escapar(t.clube)}</div>` : ""}
      <div class="local">${escapar([t.cidade, t.pais].filter(Boolean).join(" · "))}</div>
    </div>

    ${blocoAlerta(st)}
    ${blocoContagem(st)}

    <dl>
      ${campo("Datas do torneio", formataFaixa(t.inicio, t.fim), true)}
      ${campo("Inscrições até", inscricao)}
      ${campo("Pagamento até", pagamento)}
      ${campo("Gênero", t.genero)}
    </dl>

    <div class="rodape">
      ${t.link ? `<a class="botao" href="${escapar(t.link)}" target="_blank" rel="noopener">Ver torneio</a>` : ""}
    </div>
  </article>`;
}

function formataRestante(ms) {
  const total = Math.max(0, Math.floor(ms / 1000));
  const d = Math.floor(total / 86400);
  const h = Math.floor((total % 86400) / 3600);
  const m = Math.floor((total % 3600) / 60);
  const s = total % 60;
  const bloco = (v, r) => `<div class="bloco-t"><b>${String(v).padStart(2, "0")}</b><span>${r}</span></div>`;
  return bloco(d, "dias") + bloco(h, "horas") + bloco(m, "min") + bloco(s, "seg");
}

function atualizarRelogios() {
  const agora = Date.now();
  document.querySelectorAll(".contagem").forEach(el => {
    const alvo = Number(el.dataset.alvo);
    const cont = el.querySelector(".relogio");
    cont.innerHTML = alvo - agora > 0
      ? formataRestante(alvo - agora)
      : `<span class="encerrado">Prazo encerrado</span>`;
  });
}

function passaFiltro(t, st) {
  if (ESTADO.circuito !== "todos" && circuitoDe(t) !== ESTADO.circuito) return false;
  if (ESTADO.categoria !== "todas" && categoriaDe(t) !== ESTADO.categoria) return false;
  if (ESTADO.status === "abertas" && st.chave !== "abertas") return false;
  if (ESTADO.status === "pagamento" && st.chave !== "pagamento") return false;
  return true;
}

function ordenar(a, b) {
  const peso = { pagamento: 0, abertas: 1, curso: 2, fechadas: 3 };
  if (peso[a.st.chave] !== peso[b.st.chave]) return peso[a.st.chave] - peso[b.st.chave];
  const ta = a.st.alvo ? a.st.alvo.data.getTime() : Infinity;
  const tb = b.st.alvo ? b.st.alvo.data.getTime() : Infinity;
  return ta - tb;
}

function renderizar() {
  const agora = new Date();
  const itens = TORNEIOS.map(t => ({ t, st: calcularStatus(t, agora) }));

  document.getElementById("k-abertas").textContent = itens.filter(i => i.st.chave === "abertas").length;
  document.getElementById("k-pagamento").textContent = itens.filter(i => i.st.chave === "pagamento").length;

  const visiveis = itens.filter(i => passaFiltro(i.t, i.st)).sort(ordenar);
  document.getElementById("lista").innerHTML = visiveis.length
    ? visiveis.map(i => cartao(i.t, i.st)).join("")
    : `<div class="vazio-lista">Nenhum torneio com estes filtros.</div>`;

  atualizarRelogios();
}

function ligarFiltros() {
  document.querySelectorAll(".grupo").forEach(grupo => {
    const chave = grupo.id.replace("f-", "");
    grupo.querySelectorAll(".chip").forEach(botao => {
      botao.addEventListener("click", () => {
        grupo.querySelectorAll(".chip").forEach(b => b.setAttribute("aria-pressed", "false"));
        botao.setAttribute("aria-pressed", "true");
        ESTADO[chave] = botao.dataset.valor;
        renderizar();
      });
    });
  });
}

async function carregar() {
  let dados = null;
  let erro = "";
  try {
    const resp = await fetch(ARQUIVO_JSON, { cache: "no-store" });
    if (resp.ok) dados = await resp.json();
    else erro = `resposta ${resp.status}`;
  } catch (e) {
    erro = "o navegador bloqueou a leitura (abra a página pelo GitHub Pages ou por um servidor local, não pelo arquivo)";
  }
  if (!dados) {
    document.getElementById("atualizado").textContent = `Dados não carregados (${ARQUIVO_JSON}): ${erro}`;
    document.getElementById("lista").innerHTML = `<div class="vazio-lista">Nenhum torneio carregado.</div>`;
    return;
  }
  TORNEIOS = dados;

  const ultima = dados.map(t => t.coletadoEm).filter(Boolean).sort().pop();
  document.getElementById("atualizado").textContent =
    ultima ? `Última atualização: ${formataDataHora(ultima)}` : "Última atualização: não informada";

  renderizar();
}

ligarFiltros();
carregar();
setInterval(() => {
  const agora = new Date();
  const mudou = TORNEIOS.some(t => {
    const st = calcularStatus(t, agora);
    return st.alvo && st.alvo.data < agora;
  });
  if (mudou) renderizar(); else atualizarRelogios();
}, 1000);
</script>
</body>
</html>
